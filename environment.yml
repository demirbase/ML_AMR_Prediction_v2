# ============================================================================
# Conda environment for the AMR Prediction pipeline (SCALE_MLOPS_PLAN.md §7.5)
# ============================================================================
# Create / update with:
#     conda env create -f environment.yml
#     conda env update -f environment.yml --prune
#
# This file captures BOTH the Python stack and the external bioinformatics
# tools (KMC, BLAST+, bcalm/unitig-caller, PopPUNK) that pip cannot install, so
# the whole pipeline is reproducible from a single command. It is the recipe
# amr.def feeds to mamba, and therefore the definition of the ONE container the
# pipeline runs in.
#
# ── VERSIONS ARE PINNED ON PURPOSE (publication reproducibility) ────────────
# Every version below is the EXACT version verified running in the container
# that produced the published lineage labels and models (captured 2026-07-15
# from amr-pp.sif via `conda env export -p /opt/amr-env`). They are `=` pins,
# not floors, because floors do not reproduce: `poppunk>=2.6` would resolve to
# a newer PopPUNK whose clustering may differ, silently invalidating every
# lineage-aware CV result and the empirical dbscan justification in
# config/config.yaml. Bump a pin deliberately, then re-verify the clustering.
#
# The exact solved environment (all transitive deps + build strings) lives in
# environment.lock.yml, generated FROM the rebuilt container:
#     apptainer exec <sif> conda env export -p /opt/amr-env > environment.lock.yml
# Regenerate the lock whenever this file changes.
# ============================================================================
name: amr-prediction
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.12.13

  # ── Core data science ─────────────────────────────────────────────────────
  - pandas=3.0.3
  - numpy=2.5.0
  - scipy=1.18.0

  # ── Machine learning ──────────────────────────────────────────────────────
  - scikit-learn=1.9.0
  - xgboost=3.2.0
  - optuna=4.9.0
  - joblib=1.5.3
  # NOTE: the `shap` library is deliberately NOT a dependency. TreeSHAP feature
  # importance (13_stability_selection.shap_importance) uses XGBoost's BUILT-IN
  # implementation (`predict(..., pred_contribs=True)`), so nothing imports
  # `shap`. An earlier `shap>=0.44` entry here was dead weight — no container
  # ever had it, and the pipeline never missed it.

  # ── Visualisation ─────────────────────────────────────────────────────────
  - matplotlib=3.11.0
  - seaborn=0.13.2

  # ── Bioinformatics (Python) ───────────────────────────────────────────────
  - biopython=1.87

  # ── Utilities ─────────────────────────────────────────────────────────────
  - pyyaml=6.0.3
  - tqdm=4.68.3
  - certifi=2026.6.17   # CA bundle for BV-BRC HTTPS (step 00a)
  # PopPUNK 2.7.x still imports the legacy `pkg_resources`, which setuptools
  # REMOVED in v81 (2025) -> ModuleNotFoundError without this pin. Verified:
  # the working PopPUNK container carries setuptools 80.10.2.
  - setuptools=80.10.2

  # ── External tools (bioconda) — required by steps 02/03 and 08 ────────────
  - kmc=3.2.4          # k-mer counting (02/02b QC + raw-k-mer 03 baseline)
  - blast=2.17.0       # step 08 BLAST (blastn via 08_blast_annotation.py subprocess)

  # ── Unitig representation (ROADMAP §0.1 M12 — replaces raw k-mers) ─────────
  # bcalm builds the compacted de Bruijn graph (unitigs); unitig-caller (pyseer
  # ecosystem) calls per-sample unitig presence/absence -> binary matrix input
  # for the same downstream XGBoost. KMC above is kept for QC/spectra only.
  - bcalm=2.2.3
  - unitig-caller=1.3.2

  # ── Lineage / population structure (ROADMAP §0.1 M2 — lineage-aware CV) ────
  # PopPUNK clusters genomes into lineages (organism-level, antibiotic-independent)
  # so train/test folds keep an entire lineage on one side (lib/lineage.py) and
  # the reported AUC is not inflated by lineage leakage. Pinned exactly: PopPUNK
  # defines the CV groups, so its version is a scientific parameter, not an
  # implementation detail.
  - poppunk=2.7.8

  # ── Dev / tests ───────────────────────────────────────────────────────────
  - pytest=9.1.1
