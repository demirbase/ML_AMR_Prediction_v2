# ============================================================================
# Conda environment for the AMR Prediction pipeline (SCALE_MLOPS_PLAN.md §7.5)
# ============================================================================
# Create / update with:
#     conda env create -f environment.yml
#     conda env update -f environment.yml --prune
#
# This file captures BOTH the Python stack and the external bioinformatics
# tools (KMC, BLAST+, Nextflow) that pip cannot install, so the whole pipeline
# is reproducible from a single command.
#
# For an EXACT lock from your working machine, run:
#     conda env export --no-builds > environment.lock.yml
#     pip freeze > requirements.lock.txt
# and commit those lock files alongside this one.
# ============================================================================
name: amr-prediction
channels:
  - conda-forge
  - bioconda
dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python>=3.10,<3.13

  # ── Core data science ─────────────────────────────────────────────────────
  - pandas>=1.3
  - numpy>=1.21
  - scipy>=1.7

  # ── Machine learning ──────────────────────────────────────────────────────
  - scikit-learn>=1.0
  - xgboost>=1.5
  - optuna>=2.10
  - joblib>=1.0
  # SHAP (TreeSHAP) feature importance on the restricted candidate model
  # (ROADMAP §0.1 M4 — Gain -> SHAP; only on the candidate set, never the full
  # 4.9M-feature matrix). Rebuild amr.sif when the M4/CPSS work lands.
  - shap>=0.44

  # ── Visualisation ─────────────────────────────────────────────────────────
  - matplotlib>=3.4
  - seaborn>=0.11

  # ── Bioinformatics (Python) ───────────────────────────────────────────────
  - biopython>=1.79

  # ── Utilities ─────────────────────────────────────────────────────────────
  - pyyaml>=5.4
  - tqdm>=4.62
  - certifi>=2021.10.8   # CA bundle for BV-BRC HTTPS (step 00a)
  # PopPUNK imports the legacy `pkg_resources`, which setuptools REMOVED in
  # v81 (2025). Pin below that so the module exists in the container.
  - setuptools<81

  # ── External tools (bioconda) — required by steps 02/03 and 08 ────────────
  - kmc>=3.2          # k-mer counting (02/02b QC + raw-k-mer 03 baseline)
  - blast>=2.12
  - nextflow>=22.10

  # ── Unitig representation (ROADMAP §0.1 M12 — replaces raw k-mers) ─────────
  # bcalm builds the compacted de Bruijn graph (unitigs); unitig-caller (pyseer
  # ecosystem) calls per-sample unitig presence/absence -> binary matrix input
  # for the same downstream XGBoost. KMC above is kept for QC/spectra only.
  # NOTE: adding these REQUIRES rebuilding the Apptainer container on TRUBA
  # (`apptainer build --fakeroot amr.sif amr.def`; amr.def pulls this file).
  - bcalm>=2.2
  - unitig-caller>=1.2

  # ── Lineage / population structure (ROADMAP §0.1 M2 — lineage-aware CV) ────
  # PopPUNK clusters genomes into lineages (organism-level, antibiotic-independent)
  # so train/test folds can keep an entire lineage on one side (GroupKFold) and
  # the reported AUC is not inflated by lineage leakage (lib/lineage.py).
  # NOTE: adding this REQUIRES rebuilding the Apptainer container on TRUBA.
  - poppunk>=2.6
  # PopPUNK 2.7.x still imports the legacy `pkg_resources`, which setuptools
  # removed in v81 -> pin below that so the module stays importable
  # (ModuleNotFoundError: No module named 'pkg_resources' otherwise).
  - setuptools<81

  # ── Dev / tests ───────────────────────────────────────────────────────────
  - pytest>=7.0
