# ============================================================================
# AMR PREDICTION PROJECT CONFIGURATION FILE
# ============================================================================
# This YAML file contains all configurable parameters for the antimicrobial
# resistance prediction pipeline. Modify these values to customize the
# analysis for different antibiotics, organisms, or computational resources.
#
# Purpose: Centralized configuration for reproducibility and easy parameter tuning
# Date: 2025
# ============================================================================

# ----------------------------------------------------------------------------
# PROJECT METADATA
# ----------------------------------------------------------------------------
project:
  name: "AMR_Genomic_Project"
  description: "Machine learning-based antimicrobial resistance prediction using k-mer features"
  target_antibiotic: "ampicillin"  # Primary antibiotic for analysis
  organism: "ecoli"  # Organism registry slug (see config/registry/organisms.yaml)
  organism_display: "Escherichia coli"  # Human-readable name (display only)
  model: "xgboost"  # ML model
  version: "M4-pro"

# ----------------------------------------------------------------------------
# REGISTRY (single source of truth for organisms & antibiotic classes)
# ----------------------------------------------------------------------------
registry:
  organisms_file:   "config/registry/organisms.yaml"
  antibiotics_file: "config/registry/antibiotics.yaml"

# ----------------------------------------------------------------------------
# DIRECTORY PATHS (Relative to project root)
# ----------------------------------------------------------------------------
# All paths use forward slashes for cross-platform compatibility
# Absolute paths or ~ (home directory) can also be used
#
# MULTI-ANTIBIOTIC ARCHITECTURE:
# Changing 'target_antibiotic' automatically creates isolated directory structures:
# - data/processed/{antibiotic}/matrix/
# - models/{antibiotic}/
# - results/{antibiotic}/
# - logs/{antibiotic}/
#
# Cookiecutter Data Science layout:
# - data/raw/raw_genomes/       — original, immutable genome assemblies
# - data/external/metadata/     — AMR phenotype labels
# - data/external/blast_db/     — third-party databases (CARD)
# - data/interim/               — intermediate transformations (k-mer DBs)
# - data/processed/             — final, canonical feature matrices
# - results/                    — all analysis outputs (replaces analysis_results/)
paths:
  # ── Global (shared across all antibiotics) ────────────────────────────────
  data_dir:         "data"
  raw_genomes_dir:  "data/raw/raw_genomes"              # Immutable genome assemblies
  metadata_file:    "data/external/metadata/genome_amr_matrix.csv"  # AMR phenotype labels
  kmc_outputs_dir:  "data/interim/global_kmc_outputs"   # KMC binary databases
  dir_global_exploration: "results/global_exploration"  # Global QC and validation outputs

  # ── Antibiotic-specific (resolved with {antibiotic} placeholder) ───────────
  matrix_dir:           "data/processed/{antibiotic}/matrix"  # Feature matrices & labels
  logs_dir:             "logs/{antibiotic}"                    # Processing logs
  models_dir:           "models/{antibiotic}"                  # Trained models
  analysis_results_dir: "results/{antibiotic}"                 # Analysis outputs

  # Standardised, numbered analysis sub-directories (created on demand by each script)
  # Sequentially numbered so output folders sort naturally and reproduce the pipeline order.
  dir_01_data_exploration:   "results/{antibiotic}/01_data_exploration"
  dir_02_matrix_qc:          "results/{antibiotic}/02_matrix_qc"
  dir_03_model_optimization: "results/{antibiotic}/03_model_optimization"
  dir_04_evaluation:         "results/{antibiotic}/04_evaluation"
  dir_05_explainability:     "results/{antibiotic}/05_explainability"

  # ── External tool paths (system-specific) ─────────────────────────────────
  kmc_bin:       "bin/bin/kmc"        # Relative to project root
  kmc_tools_bin: "bin/bin/kmc_tools"  # Relative to project root

# ----------------------------------------------------------------------------
# ORGANISM-AWARE PATH TEMPLATES (SCALE_MLOPS_PLAN.md §4) — ADDITIVE / FORWARD
# ----------------------------------------------------------------------------
# These {organism}-scoped templates are consumed ONLY by scripts/lib/config.py
# (resolve_path) and scripts/migrate_to_organism_layout.py. The legacy `paths:`
# keys above are intentionally left untouched so the current numbered scripts
# keep working on the existing single-organism layout. Once you run the
# migration script and cut a script over to resolve_path(), it reads from here.
paths_organism:
  # ── Global / shared (organism-independent — NOT moved by the migration) ────
  data_dir:               "data"
  blast_db_dir:           "data/external/blast_db/card_nt"
  kmc_bin:                "bin/bin/kmc"
  kmc_tools_bin:          "bin/bin/kmc_tools"

  # Global QC / validation outputs are now ORGANISM-SCOPED so two organisms do
  # not overwrite each other's validation_report.txt / global_qc_outliers.csv.
  dir_global_exploration: "results/{organism}/global_exploration"

  # ── Organism-scoped ────────────────────────────────────────────────────────
  raw_genomes_dir:  "data/raw/{organism}/genomes"
  metadata_file:    "data/external/{organism}/metadata/amr_phenotypes.csv"
  kmc_outputs_dir:  "data/interim/{organism}/kmc_outputs"
  # PopPUNK lineage labels (02c) — organism-level, antibiotic-independent (one
  # clustering reused by every antibiotic's lineage-aware CV).
  lineage_dir:      "data/processed/{organism}/lineage"

  # ── Organism + antibiotic-scoped ───────────────────────────────────────────
  matrix_dir:           "data/processed/{organism}/{antibiotic}/matrix"
  models_dir:           "models/{organism}/{antibiotic}"
  logs_dir:             "logs/{organism}/{antibiotic}"
  analysis_results_dir: "results/{organism}/{antibiotic}"
  dir_01_data_exploration:   "results/{organism}/{antibiotic}/01_data_exploration"
  dir_02_matrix_qc:          "results/{organism}/{antibiotic}/02_matrix_qc"
  dir_03_model_optimization: "results/{organism}/{antibiotic}/03_model_optimization"
  dir_04_evaluation:         "results/{organism}/{antibiotic}/04_evaluation"
  dir_05_explainability:     "results/{organism}/{antibiotic}/05_explainability"
  experiment_config:    "config/experiments/{organism}/config_{antibiotic}.yaml"

  # MLOps run metadata (SCALE_MLOPS_PLAN.md §7)
  run_dir:              "runs/{organism}/{antibiotic}/{run_id}"

# ----------------------------------------------------------------------------
# PROVENANCE (reproducibility / future Knowledge Base — SCALE_MLOPS_PLAN.md §4.1)
# ----------------------------------------------------------------------------
provenance:
  card_version:     null      # e.g. "CARD v3.2.9" — fill in before BLAST for citeability
  kb_schema_version: "v0.1.0"
  # NCBI Entrez identity is configured under the `ncbi:` section below
  # (entrez_email / api_key); it is the single source for Step 09.

# ----------------------------------------------------------------------------
# DATA PREPROCESSING PARAMETERS
# ----------------------------------------------------------------------------
preprocessing:
  # K-mer counting configuration
  k_length: 21  # K-mer length
  # Minimum-support (rare-k-mer) filter — DATA-ADAPTIVE so it scales with dataset
  # size across antibiotics/organisms (a fixed count would drop almost everything
  # on a small dataset and under-filter on a large one). 03 derives the effective
  # value as:
  #     min_support = max(min_support_floor, ceil(min_prevalence * n_genomes))
  # Biology: a k-mer below ~1% prevalence cannot reach step-10's discriminativeness
  # threshold (|Δprev| >= 0.10 needs ~10% prevalence), so the 1% floor drops only
  # the rare / lineage-specific / sequencing-error tail and keeps every k-mer that
  # could individually be a real marker. Large sets get aggressive de-confounding
  # (faster training); small sets fall back to the absolute floor (keep markers).
  min_support: null        # explicit override (int) — null = auto-derive (below)
  min_support_floor: 5     # absolute noise floor (drop k-mers in < this many genomes)
  min_prevalence: 0.01     # fraction of genomes; auto min_support scales with data size

  # Computational resources
  kmc_mem: 16  # Memory allocation for KMC (GB)
  threads: 10  # Number of CPU threads to use
  chunk_size: 200  # Genomes per matrix chunk (for RAM management)
  
  # Feature engineering
  encoding: "binary"  # Binary (presence/absence) or frequency-basedß
  # Binary is preferred for assembled genomes

  # Feature representation consumed DOWNSTREAM (03b/04/05/06/07/07b). This is the
  # single switch for the unitig pivot (ROADMAP §0 M12):
  #   "kmer"   -> resolve_path('matrix_dir') = …/{antibiotic}/matrix      (03, raw k-mers)
  #   "unitig" -> resolve_path('matrix_dir') = …/{antibiotic}/<unitig.out_subdir> (03u)
  # Flipping this makes the WHOLE HPO/train/eval chain run on unitigs with NO
  # per-script change (resolve_path redirects the matrix dir). The raw-k-mer
  # baseline under …/matrix is preserved either way (03u writes a separate dir).
  feature_repr: "kmer"   # kmer | unitig

# ----------------------------------------------------------------------------
# UNITIG REPRESENTATION (ROADMAP §0.1 M12 — replaces raw k-mers downstream)
# ----------------------------------------------------------------------------
# Consumed by 03u_unitig_matrix.py. unitig-caller (Bifrost backend) builds the
# population compacted de Bruijn graph and emits a genome×unitig presence/absence
# matrix in the SAME chunked .npz contract as 03 (features.txt / y_{ab}.csv /
# genomes_{ab}.csv / X_{ab}_part_*.npz), so 03b/04/05/06/07/07b read it unchanged.
# KMC (02/02b) is kept for QC/spectra only. Output is written to a SEPARATE
# sibling dir (out_subdir) so the raw-k-mer 'matrix' baseline is never overwritten.
unitig:
  # Sibling of data/processed/{organism}/{antibiotic}/matrix. Keep distinct from
  # "matrix" so the raw-k-mer baseline (for the thesis unitig-vs-k-mer table) stays.
  out_subdir: "matrix_unitig"
  # ABSOLUTE minimum genome count to keep a unitig (ROADMAP §0.7 risk-4: use an
  # absolute floor, NOT a proportional one, so a rare-but-real plasmid unitig is
  # not dropped). Zero-variance core (present in every genome) is always dropped.
  # NOTE: this is tuned for the full ~4000-genome run; lower it (e.g. --min-support
  # 1) for tiny datasets/smoke tests via the CLI flag.
  min_support: 10
  # Organism-level store (03u --build-db): run unitig-caller ONCE over all the
  # organism's assemblies, then each antibiotic SUBSETS the store (no re-run).
  # db_min_support is the store's absolute floor; keep it <= every antibiotic's
  # min_support so nothing a per-antibiotic filter would keep is pre-dropped
  # (2 = drop only singletons, always safe since they can never reach support>=2
  # in any subset).
  db_min_support: 2
  # unitig-caller thread count. null -> fall back to preprocessing.threads.
  threads: null

# ----------------------------------------------------------------------------
# LINEAGE-AWARE CV (ROADMAP §0.1 M2 — PopPUNK clusters + GroupKFold)
# ----------------------------------------------------------------------------
# 02c runs PopPUNK once per organism (antibiotic-independent) to label each genome
# with a lineage cluster; lib/lineage.py then builds GroupKFold folds so an entire
# lineage stays on one side of train/test (no lineage leakage — ROADMAP §0.1).
lineage:
  # dbscan gives proper strain-level resolution on E. coli (324 clusters, largest
  # ~15%); bgmm collapsed into one ~94% mega-cluster AND its degenerate 2-Gaussian
  # fit made refine fail (NaN boundary). So: dbscan, no refine (dbscan alone is
  # already well-distributed for GroupKFold; refine is an optional future sharpen).
  model: "dbscan"        # PopPUNK --fit-model: dbscan | bgmm
  refine: false          # dbscan alone suffices; refine on bgmm failed on this data
  threads: null          # null -> preprocessing.threads
  # ── consumed by the CV step (lib/lineage, 06/07b wiring) ──
  n_splits: 5            # StratifiedGroupKFold folds (ROADMAP §0.1: 5-10)
  min_cluster_size: 10   # pool clusters smaller than this (collapse_rare_clusters); 0/1 = keep all

# ----------------------------------------------------------------------------
# MACHINE LEARNING TRAINING PARAMETERS
# ----------------------------------------------------------------------------
training:
  # Data splitting (Scale-Invariant Fractional Method)
  random_seed: 42  # For reproducible train/test splits
  test_fraction: 0.20  # Fraction of total chunks reserved for testing (20%)
  validation_fraction: 0.2  # Fraction of training data for early stopping validation
  
  # Hyperparameter optimization
  n_trials: 30  # Number of Optuna optimization trials (upper bound)
  # Early-stopping for HPO: stop once this many COMPLETED trials pass without
  # improving the best score (TPE usually converges early; e.g. the unitig run's
  # best was found by trial ~20). 0/null = run all n_trials. Env override:
  # AMR_OPTUNA_PATIENCE.
  optuna_patience: 15
  optuna_fraction: 0.2  # Fraction of training chunks loaded into RAM during Bayesian opt (20%)
  optimization_metric: "auc"  # Metric to optimize (auc, accuracy, f1)
  # Parallel HPO (04_optimization.py): run several trials CONCURRENTLY, each
  # XGBoost using this many threads. Optuna n_jobs is derived as
  # (allocated cores // optuna_threads_per_trial) so all cores stay busy on the
  # small HPO subset (avoids low SLURM CPU-efficiency warnings on HPC). Lower =
  # more concurrent trials (e.g. 1 -> one trial per core); higher = fewer, fatter
  # trials. Allocated cores come from SLURM_CPUS_PER_TASK (else os.cpu_count()).
  optuna_threads_per_trial: 2
  # Final training (05_model_training.py): tree count is found by early stopping
  # on a held-out slice of the FULL training set (the HPO-subset n_estimators is
  # too small for full-data training -> underfitting). max_boost_rounds is the
  # early-stopping ceiling; the model then retrains on all train rows with the
  # discovered count.
  max_boost_rounds: 5000
  # Build the train DMatrix in external memory (pages spilled to scratch) so the
  # full 50.8M-feature matrix fits a 384 GB node. NOTE: raising min_support does
  # NOT shrink RAM (nnz is dominated by common k-mers, not the rare tail it
  # removes). To train IN-CORE (external_memory: false, fast, no low-efficiency
  # warning) the only lever is fewer GENOMES -> see max_train_chunks.
  external_memory: true
  # Optional: train on this many train chunks (stratified subset) instead of all,
  # to shrink nnz enough for in-core training. null = use all chunks. e.g. 12 ≈
  # 2400 genomes (~14B nnz) fits in-core on a 384 GB node; full 18 chunks OOMs.
  max_train_chunks: null

# ----------------------------------------------------------------------------
# XGBOOST MODEL CONFIGURATION
# ----------------------------------------------------------------------------
xgboost_params:
  # Core parameters (fixed during training)
  objective: "binary:logistic"  # Binary classification
  eval_metric: "auc"  # Evaluation metric
  booster: "gbtree"  # Tree-based booster
  tree_method: "hist"  # Histogram-based algorithm (faster)
  device: "cpu"  # Computation device (cpu or cuda for GPU)
  verbosity: 1  # 0=silent, 1=warning, 2=info, 3=debug
  n_jobs: 10  # Parallel threads
  
  # Early stopping
  early_stopping_rounds: 50  # Stop if no improvement for N rounds

# ----------------------------------------------------------------------------
# OPTIMIZED HYPERPARAMETERS
# ----------------------------------------------------------------------------
# NOTE: Hyperparameters are now stored in antibiotic-specific config files:
# - config/config_ciprofloxacin.yaml
# - config/config_tetracycline.yaml
# - etc.
#
# These files are auto-generated by 04_optimization.py and contain:
# - Optimization metadata (date, ROC AUC, trials)
# - Fixed XGBoost parameters
# - Best hyperparameters from Optuna optimization
#
# This architecture enables parallel optimization for multiple antibiotics
# without conflicts.

# ----------------------------------------------------------------------------
# ANALYSIS PARAMETERS
# ----------------------------------------------------------------------------
analysis:
  top_n_features: 50  # Number of top features to extract for biological analysis
  stability_threshold: 0.6  # selection_frequency >= this -> "stable" k-mer (07b; ROADMAP H1)

  # ── BLAST confidence tiers (step 09) ──────────────────────────────────────
  # Every BLAST hit is graded so weak matches are never presented as findings.
  # For a 21-mer the primary, DB-size-independent criteria are IDENTITY and
  # COVERAGE (alignment length / k); E-value is only a loose secondary gate
  # because it depends on database size (CARD ~MB vs NCBI nt ~TB) and is NOT
  # comparable across the two databases. Thresholds live here (citeable in
  # Methods; ROADMAP Risk-4 / §1.4). Tiers checked best-first: confirmed→candidate→weak.
  #   confirmed : near-exact full-length match to a known ARG
  #   candidate : strong but partial (kept + flagged, NOT dropped)
  #   weak      : reported transparently but flagged; below report_max_evalue dropped
  confidence_tiers:
    confirmed: {min_identity: 95.0, min_coverage: 0.95, max_evalue: 1.0}
    candidate: {min_identity: 90.0, min_coverage: 0.80, max_evalue: 10.0}
    weak:      {min_identity: 80.0, min_coverage: 0.60, max_evalue: 50.0}
  report_max_evalue: 50.0  # hits weaker than this are excluded from the report entirely

# ----------------------------------------------------------------------------
# BLAST ANNOTATION PARAMETERS (Step 08)
# ----------------------------------------------------------------------------
# Used by 08_blast_annotation.py (Python orchestrator) and
# 08_blast_pipeline.nf (Nextflow processes).
#
# CARD Local BLAST:
#   - card_db_dir / card_db_name point to a pre-built blastn database from the
#     Comprehensive Antibiotic Resistance Database (CARD).
#   - Build with: makeblastdb -in card.fna -dbtype nucl -out data/blast_db/card_nt/card
#
# NCBI Remote BLAST:
#   - Uses the NCBI blastn -remote flag. Requires an internet connection.
#   - No local database needed; queries are sent directly to NCBI servers.
blast:
  card_db_dir:  "data/external/blast_db/card_nt"  # Relative to project root (Cookiecutter: external)
  card_db_name: "card"                   # Base name of the blastn database
  evalue:       10                        # E-value threshold for reporting hits
  word_size:    11                        # Seed word size (11 is standard for short seqs)
  threads:      8                         # CPU threads for local BLAST only
  # BLAST -task: null = auto from feature_repr (unitig -> 'blastn' for long queries,
  # k-mer -> 'blastn-short' for <30 bp). Set explicitly to override.
  task:         null

  # ── CARD variant/SNP data (step 11 — k-mer-centric SNP allele check) ──────
  # NOT shipped with the repo (the bundled card.fna is the homolog model only).
  # Download the full CARD data bundle to get these:
  #   mkdir -p data/external/card && cd data/external/card
  #   wget https://card.mcmaster.ca/latest/data -O card-data.tar.bz2
  #   tar xjf card-data.tar.bz2          # -> card.json + *_variant_model.fasta
  card_variant_fasta: "data/external/card/nucleotide_fasta_protein_variant_model.fasta"
  card_json:          "data/external/card/card.json"
  # CARD ARO ontology index (M16): maps ARO accession -> gene family / drug class /
  # resistance mechanism for the KB. null = auto (aro_index.tsv next to card.json).
  aro_index:          null

# ----------------------------------------------------------------------------
# NCBI ENTREZ PARAMETERS (Step 09 — biological summary)
# ----------------------------------------------------------------------------
# 09_biological_summary.py queries NCBI Entrez efetch to resolve gene names.
# NCBI's Terms of Use REQUIRE a valid contact e-mail; a placeholder address
# (e.g. user@example.com) risks an IP ban. Set your real e-mail below.
# An optional API key raises the rate limit from 3 to 10 requests/sec:
#   https://ncbiinsights.ncbi.nlm.nih.gov/2017/11/02/new-api-keys-for-the-e-utilities/
ncbi:
  entrez_email: ""    # REQUIRED — set to your real e-mail before running Step 09
  api_key:      ""     # OPTIONAL — NCBI API key for a higher rate limit