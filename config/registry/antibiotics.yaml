# ============================================================================
# ANTIBIOTIC NAME ALIASES (raw-source spelling variants / typos -> canonical)
# ============================================================================
# Single source for name normalisation, used by lib.registry.normalize_antibiotic()
# when cleaning raw AMR downloads (step 00). The canonical (key) MUST also appear
# as a `members` entry above so class grouping stays consistent. Raw names not
# listed here pass through unchanged (case-insensitively matched to a member).
#
# NOTE: co-trimoxazole == trimethoprim/sulfamethoxazole (same drug) — merged into
# one canonical to avoid an ambiguous alias mapping.
aliases:
  amoxicillin_clavulanic_acid: ["amoxicillin/clavulanic acid", "amoxicillin-clavulanic acid", "amoxicillin_clavulanat"]
  # Canonical is the underscore form (slash-safe for file paths), same as the
  # other combo drugs. It was previously inverted (slash canonical) — the M9 slash
  # sweep missed it — which broke A. baumannii's paths (ampicillin/sulbactam is a
  # key sulbactam-based therapy there, minority 405).
  ampicillin_sulbactam: ["ampicillin/sulbactam", "ampicillin-sulbactam", "amipicillin_sulbactam"]
  cephalothin: ["cefalotin", "cefalothin"]
  cefpirome: ["cefpirom"]
  ceftaroline: ["ceftarolin"]
  "ceftazidime/avibactam": ["ceftazidime-avibactam", "ceftazidime_avibactam"]
  "ceftolozane/tazobactam": ["ceftolozane-tazobactam"]
  fosfomycin: ["phosphomycin"]
  gentamicin: ["geamycin"]
  piperacillin_tazobactam: ["piperacillin/tazobactam", "piperacillin-tazobactam", "tazobactam_piperacillin"]
  "polymyxin B": ["polymyxin b", "polymyxin_b"]
  rifampin: ["rifampicin"]
  tetracycline: ["tetracyklin"]
  tigecycline: ["tigecyklin"]
  trimethoprim: ["trimotheprim"]
  trimethoprim_sulfamethoxazole:
    - "trimethoprim/sulfamethoxazole"
    - "co-trimoxazole"
    - "co_trimoxazole"
    - "trimethoprim-sulfamethoxazole"
    - "sulfamethoxazole/trimethoprim"
  "ticarcillin/clavulanic acid": ["ticarcillin_clavulanate"]
  "meropenem/vaborbactam": ["meropenem-vaborbactam"]
  "cefepime/taniborbactam": ["cefepime_taniborbactam"]

# ============================================================================
# AMRFinderPlus Class/Subclass -> antibiotic keyword map (M13 concordance;
# scripts/16_external_concordance.py, audit Issue 9). A genome is genotypic-R
# for an antibiotic if any AMR-type AMRFinderPlus row's Class/Subclass tokens
# intersect this set. Add an antibiotic here (no code change) to include it in
# the concordance. Note the biology: a narrow BETA-LACTAM (TEM-1) implies
# ampicillin-R but NOT cefotaxime-R (that needs an ESBL/AmpC -> CEPHALOSPORIN).
# ============================================================================
# NOTE (2026-07-07): tokens below cover the 17-model KB panel. They are
# AMRFinderPlus Class/Subclass approximations — VERIFY against actual AFP output
# when running M13 (16_external_concordance) on the new antibiotics; refine if a
# determinant maps too broadly (see the narrow-vs-broad beta-lactam caveat above).
amrfinder_keywords:
  ampicillin:                    [AMPICILLIN, BETA-LACTAM]
  amoxicillin_clavulanic_acid:   [AMOXICILLIN, BETA-LACTAM]
  piperacillin_tazobactam:       [PIPERACILLIN, BETA-LACTAM]
  ampicillin_sulbactam:          [AMPICILLIN, SULBACTAM, BETA-LACTAM]
  cefotaxime:                    [CEFOTAXIME, CEPHALOSPORIN]
  ceftazidime:                   [CEFTAZIDIME, CEPHALOSPORIN]
  cefepime:                      [CEFEPIME, CEPHALOSPORIN]
  cefoxitin:                     [CEFOXITIN, CEPHALOSPORIN, CEPHAMYCIN, METHICILLIN]
  meropenem:                     [MEROPENEM, CARBAPENEM]
  imipenem:                      [IMIPENEM, CARBAPENEM]
  ciprofloxacin:                 [CIPROFLOXACIN, FLUOROQUINOLONE, QUINOLONE]
  gentamicin:                    [GENTAMICIN, AMINOGLYCOSIDE]
  tobramycin:                    [TOBRAMYCIN, AMINOGLYCOSIDE]
  amikacin:                      [AMIKACIN, AMINOGLYCOSIDE]
  levofloxacin:                  [LEVOFLOXACIN, FLUOROQUINOLONE, QUINOLONE]
  tetracycline:                  [TETRACYCLINE]
  trimethoprim_sulfamethoxazole: [TRIMETHOPRIM, SULFAMETHOXAZOLE, SULFONAMIDE]
  oxacillin:                     [OXACILLIN, METHICILLIN]
  erythromycin:                  [ERYTHROMYCIN, MACROLIDE]
  clindamycin:                   [CLINDAMYCIN, LINCOSAMIDE]

# ============================================================================
# DOMINANT RESISTANCE MECHANISM per class — acquired gene vs target-gene SNP.
# The thesis "acquired vs target-SNP" showcase axis; consumed by
# populate_database (antibiotics.mechanism_type via lib.registry). For classes
# not yet in the KB the value is the literature-dominant style (provisional —
# refine when that class is actually modelled).
# ============================================================================
class_mechanism_type:
  penicillins: acquired
  cephalosporins: acquired
  carbapenems: acquired
  monobactams: acquired
  aminoglycosides: acquired
  quinolones: target_snp            # gyrA/parC
  folate_pathway_inhibitors: acquired
  tetracyclines: acquired
  glycylcyclines: acquired
  macrolides: acquired
  lincosamides: acquired
  glycopeptides: acquired           # vanA/vanB operons
  polymyxins: target_snp            # pmrAB/lpx chromosomal dominant (mcr acquired also exists)
  oxazolidinones: target_snp        # 23S rRNA / rplC-rplD (cfr acquired is a minority)
  phenicols: acquired               # cat genes
  rifamycins: target_snp            # rpoB
  fosfomycins: acquired             # fosA (chromosomal murA/transporter SNPs also occur)
  lipopeptides: target_snp          # mprF/cls
  nitrofurans: target_snp           # nfsA/nfsB

