# ============================================================================
# ANTIBIOTIC REGISTRY — single source of truth for antibiotic → class mapping
# ============================================================================
# Replaces the ANTIBIOTIC_CLASSES dictionary previously copy-pasted in
# 01_data_validation.py and 01b_data_validation.py (audit B09/B10).
# Accessed via scripts/lib/registry.py.
#
# Adding/renaming an antibiotic class = editing this file only. No code change.
#
# TAXONOMY (schema 2.0, 2026-07-13): mechanism-based classes aligned to the
# CARD ARO ontology (see docs/literature/ESKAPEE1.md §3-5). Two deliberate
# design rules for the ML pipeline:
#   1. CARBAPENEMS are their OWN class (never lumped under beta-lactams) — a
#      blaKPC/blaNDM carbapenemase is mechanistically miles from a blaTEM
#      penicillinase; merging them would drown the specific signal in noise.
#   2. NO "others" grab-bag — glycopeptides / polymyxins / oxazolidinones /
#      phenicols / rifamycins / fosfomycins / lipopeptides / nitrofurans are
#      each their own mechanism class. A drug with too little data is left OUT
#      of scope, never merged into a mixed-mechanism bucket (that makes the
#      genotype→phenotype map non-learnable).
# Generic/inhibitor tokens with no clean ML target (bare "beta-lactam",
# "sulbactam") are intentionally UNCLASSIFIED (antibiotic_to_class -> None).
# ============================================================================
schema_version: "2.0"

classes:
  penicillins:
    display_name: "Penicillins"
    members:
      - ampicillin
      - amoxicillin
      - amoxicillin_clavulanic_acid
      - piperacillin_tazobactam
      - ampicillin_sulbactam
      - penicillin
      - oxacillin
      - carbenicillin
      - piperacillin
      - "ticarcillin/clavulanic acid"

  cephalosporins:
    display_name: "Cephalosporins"
    members:
      - ceftazidime
      - cefotaxime
      - cefuroxime
      - ceftriaxone
      - cefepime
      - cefoxitin
      - cephalothin
      - cefazolin
      - ceftiofur
      - cefpodoxime
      - cefotetan
      - "ceftazidime/avibactam"
      - ceftaroline
      - cephalexin
      - cefpodoxime_clavulanic_acid
      - "ceftolozane/tazobactam"
      - "cefotaxime/clavulanic acid"
      - cefpirome
      - "cefepime/taniborbactam"

  carbapenems:
    display_name: "Carbapenems"
    members:
      - meropenem
      - imipenem
      - ertapenem
      - doripenem
      - "meropenem/vaborbactam"

  monobactams:
    display_name: "Monobactams"
    members:
      - aztreonam

  aminoglycosides:
    display_name: "Aminoglycosides"
    members:
      - gentamicin
      - amikacin
      - tobramycin
      - streptomycin
      - kanamycin
      - apramycin
      - neomycin
      - netilmicin

  quinolones:
    display_name: "Quinolones"
    members:
      - ciprofloxacin
      - norfloxacin
      - levofloxacin
      - "nalidixic acid"
      - moxifloxacin
      - ofloxacin

  folate_pathway_inhibitors:
    display_name: "Folate Pathway Inhibitors"
    members:
      - trimethoprim_sulfamethoxazole
      - trimethoprim
      - sulfamethoxazole
      - sulfisoxazole

  tetracyclines:
    display_name: "Tetracyclines"
    members:
      - tetracycline
      - doxycycline
      - minocycline
      - oxytetracycline

  glycylcyclines:
    display_name: "Glycylcyclines"
    members:
      - tigecycline

  macrolides:
    display_name: "Macrolides"
    members:
      - erythromycin
      - azithromycin
      - clarithromycin

  lincosamides:
    display_name: "Lincosamides"
    members:
      - clindamycin
      - lincomycin

  glycopeptides:
    display_name: "Glycopeptides"
    members:
      - vancomycin
      - teicoplanin

  polymyxins:
    display_name: "Polymyxins"
    members:
      - colistin
      - "polymyxin B"

  oxazolidinones:
    display_name: "Oxazolidinones"
    members:
      - linezolid

  phenicols:
    display_name: "Phenicols"
    members:
      - chloramphenicol

  rifamycins:
    display_name: "Rifamycins"
    members:
      - rifampin

  fosfomycins:
    display_name: "Fosfomycins"
    members:
      - fosfomycin

