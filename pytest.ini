[pytest]
# ============================================================================
# Test configuration for the AMR Prediction pipeline
# ============================================================================
testpaths = tests

# Marker definitions (avoids "unknown marker" warnings)
markers =
    unit: fast, pure-function unit tests (no heavy deps, no external tools)
    smoke: import/load checks for every numbered script (catch syntax/import/config breakage)
    integration: end-to-end pipeline on a tiny SYNTHETIC dataset (needs xgboost/optuna/KMC)
    slow: long-running tests (minutes); excluded from the default run

# Default run = fast feedback only. The integration/slow tests are OPT-IN so a
# plain `pytest` NEVER mutates config or launches the heavy pipeline:
#     pytest                      -> unit + smoke (seconds)
#     pytest -m unit              -> just unit
#     pytest -m integration       -> the synthetic end-to-end run (minutes)
#     pytest -m "integration or slow" -> everything
addopts = -m "not integration and not slow" -ra
