# ============================================================================
# environment-tools.lock.yml — exact solved env for amr-tools.sif (do not hand-edit)
# ============================================================================
# Generated 2026-07-15 FROM the rebuilt container:
#   apptainer exec amr-tools-new.sif conda env export -p /opt/amr-tools-env
#
# 206 packages, every one pinned name=version=build. environment-tools.yml pins
# the DIRECT deps; this pins the whole solve. That gap is not theoretical — the
# amr.sif rebuild held every direct pin while graph-tool re-solved 2.98 -> 3.0
# underneath and changed the clustering (see environment.lock.yml).
#
# This env holds the M13 BASELINE (AMRFinderPlus 4.2.7, ResFinder 4.5.0 + kma
# 1.6.11) and M14's pyseer 1.4.1 — i.e. the tools the project's headline claim is
# measured against, and evidence layer 7. Their versions are science, not setup.
#
# `prefix: /opt/amr-tools-env` is the in-container path (amr-tools.def:
# mamba env create -p /opt/amr-tools-env). Keep it.
#
# NOTE the deliberate divergence from amr.sif — python 3.8.20 vs 3.12.13,
# numpy 1.22.4 vs 2.5.0, pandas 2.0.3 vs 3.0.3, blast 2.16.0 vs 2.17.0. It is not
# an accident to be tidied: pyseer/resfinder/AMRFinderPlus resolve to python 3.8,
# which is exactly WHY they cannot share amr.sif. The two envs exchange data as
# plain text (rtab -> pyseer -> CSV -> populate), so the split is safe — but it
# must be stated in the Methods, not discovered by a reader.
